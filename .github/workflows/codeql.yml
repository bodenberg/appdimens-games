name: CodeQL

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, cpp]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: github/codeql-action/init@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3
        with:
          languages: ${{ matrix.language }}
      - name: Build analyzed sources (java-kotlin)
        if: matrix.language == 'java-kotlin'
        run: gradle :library:assembleRelease --no-daemon
      - name: Build analyzed sources (cpp)
        if: matrix.language == 'cpp'
        run: |
          g++ -std=c++20 -fsyntax-only \
            -I library-native/src/main/cpp/include \
            -I "$JAVA_HOME/include" -I "$JAVA_HOME/include/linux" \
            library-native/src/main/cpp/jni/appdimens_games_jni.cpp
      - uses: github/codeql-action/analyze@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3
        with:
          category: /language:${{ matrix.language }}
