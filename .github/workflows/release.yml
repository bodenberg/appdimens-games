name: Release

on:
  push:
    tags: ['v3.0.0']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v3.0.0 tag to publish
        required: true
        default: v3.0.0

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish GitHub release
    if: github.event_name == 'push' || inputs.tag == 'v3.0.0'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      # Toolchain da daemon JVM do projeto = 25 (gradle/gradle-daemon-jvm.properties).
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with: { gradle-version: "9.5.0" }
      - name: Verify release version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          test "$(sed -n 's/^VERSION_NAME=//p' gradle.properties)" = '3.0.0'
          test "$(sed -n 's/^appdimens.version=//p' gradle.properties)" = '3.2.0'
          release_tag="$GITHUB_REF_NAME"
          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then release_tag="$INPUT_TAG"; fi
          test "$release_tag" = 'v3.0.0'
      # Componentes exatamente como usados pelo projeto (AGP 9.3.1 defaults).
      - name: Install Android packages
        run: sdkmanager 'platforms;android-37' 'build-tools;36.0.0' 'cmake;3.22.1' 'ndk;28.2.13676358'
      - name: Validate formulas and build release artifacts
        run: |
          python3 scripts/oracle.py
          gradle --stacktrace --no-daemon assembleRelease testDebugUnitTest :library-bom:build
      - name: Collect artifacts and checksums
        run: |
          mkdir -p dist
          find . -path '*/build/outputs/aar/*.aar' -exec cp {} dist/ \;
          find library-bom -path '*/build/publications/*' -name '*.pom' -exec cp {} dist/ \;
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v3.0.0
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
