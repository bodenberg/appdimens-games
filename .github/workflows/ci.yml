name: CI

on:
  push:
    branches: [ main, "feat/**" ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oracle:
    name: Formula oracle audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - name: Formula oracle audit
        run: python3 scripts/oracle.py

  android:
    name: Build & unit tests (all modules)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # O projeto fixa o toolchain da daemon JVM em 25 (gradle/gradle-daemon-jvm.properties).
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "25" }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "9.5.0" }
      # Componentes exatamente como usados pelo projeto (AGP 9.3.1 defaults).
      - name: Install Android packages
        run: |
          # O sdkmanager embutido no runner/setup-android não enxerga 'platforms;android-37'
          # (falhava com "Failed to find package"). Atualiza o cmdline-tools e resolve o
          # nome real do pacote (android-37 ou android-37.0, formato com API menor).
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager 'cmdline-tools;latest'
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          platform="$("$SDKM" --list 2>/dev/null | awk '{print $1}' | grep -E '^platforms;android-37(\.0)?$' | sort -u | head -n1 || true)"
          if [ -n "$platform" ]; then
            "$SDKM" "$platform" 'build-tools;36.0.0' 'cmake;3.22.1' 'ndk;28.2.13676358'
          else
            echo "::warning::Pacote android-37 não listado pelo sdkmanager; o AGP fará o download durante o build."
            "$SDKM" --list 2>/dev/null | awk '{print $1}' | grep '^platforms;' | sort -u || true
            "$SDKM" 'build-tools;36.0.0' 'cmake;3.22.1' 'ndk;28.2.13676358'
          fi
      - name: Build & test (JVM unit tests)
        # Agregação na raiz cobre todos os módulos Android (library* + sample + benchlab).
        # Variantes debug e release exercitam R8 do sample e o build nativo (JNI/C++).
        run: gradle assembleDebug assembleRelease testDebugUnitTest --no-daemon
