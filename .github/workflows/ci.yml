name: CI

on:
  push:
    branches: [ main, "feat/**" ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oracle:
    name: Formula oracle audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: { python-version: "3.10" }
      - name: Formula oracle audit
        run: python3 scripts/oracle.py

  android:
    name: Build & unit tests (all modules)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # O projeto fixa o toolchain da daemon JVM em 25 (gradle/gradle-daemon-jvm.properties).
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "25" }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "9.5.0" }
      # Componentes exatamente como usados pelo projeto (AGP 9.3.1 defaults).
      - name: Install Android packages
        run: sdkmanager 'platforms;android-37' 'build-tools;36.0.0' 'cmake;3.22.1' 'ndk;28.2.13676358'
      - name: Build & test (JVM unit tests)
        # Agregação na raiz cobre todos os módulos Android (library* + sample + benchlab).
        # Variantes debug e release exercitam R8 do sample e o build nativo (JNI/C++).
        run: gradle assembleDebug assembleRelease testDebugUnitTest --no-daemon
