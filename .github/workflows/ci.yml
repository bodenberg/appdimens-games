name: CI

on:
  push:
    branches: [ main, "feat/**" ]
  pull_request:

jobs:
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - name: Formula oracle audit
        run: python3 scripts/oracle.py

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10.2" }
      - name: Build & test (JVM unit tests)
        run: |
          gradle :library:testDebugUnitTest \
                    :library-percent:testDebugUnitTest \
                    :library-fluid:testDebugUnitTest \
                    :library-fit:testDebugUnitTest \
                    :sample:assembleDebug :benchlab:assembleDebug --no-daemon
