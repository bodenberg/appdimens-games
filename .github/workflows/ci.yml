name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-validation:
    name: Java and native contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate Java, C ABI and JNI
        run: tools/validate.sh

  android-build:
    name: Android build, tests and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Install Android packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.1.0' 'cmake;4.1.2' 'ndk;30.0.15729638'
      - name: Test, lint and assemble all modules
        run: ./gradlew --stacktrace --no-daemon check lint assembleRelease
      - name: Upload reports and artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-build-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            **/build/reports/**
            **/build/outputs/aar/*.aar
            **/build/libs/*.jar
