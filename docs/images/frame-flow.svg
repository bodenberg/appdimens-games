<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" role="img" aria-labelledby="t d"><title id="t">Fluxo de atualização de viewport</title><desc id="d">Evento de resize alimenta um cálculo batch e publica um snapshot para a render thread.</desc><rect width="960" height="260" rx="24" fill="#11151d"/><g font-family="sans-serif" text-anchor="middle" fill="#fff"><rect x="30" y="75" width="180" height="90" rx="12" fill="#475d92"/><text x="120" y="112" font-size="18">resize / fold</text><text x="120" y="138" font-size="14">safe area + DPI</text><path d="M210 120h60" stroke="#9ecaff" stroke-width="4"/><rect x="270" y="75" width="180" height="90" rx="12" fill="#6750a4"/><text x="360" y="112" font-size="18">Screen imutável</text><text x="360" y="138" font-size="14">configuração única</text><path d="M450 120h60" stroke="#9ecaff" stroke-width="4"/><rect x="510" y="75" width="180" height="90" rx="12" fill="#386a20"/><text x="600" y="112" font-size="18">cálculo batch</text><text x="600" y="138" font-size="14">JVM ou C/JNI</text><path d="M690 120h60" stroke="#9ecaff" stroke-width="4"/><rect x="750" y="75" width="180" height="90" rx="12" fill="#7d5260"/><text x="840" y="112" font-size="18">snapshot</text><text x="840" y="138" font-size="14">render / GPU</text><text x="480" y="220" font-size="16">zero acesso ao driver durante o dimensionamento</text></g></svg>
