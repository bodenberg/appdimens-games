[versions]
# Family-aligned toolchain (matches appdimens-dynamic 3.x / appdimens-kmp 1.x)
agp = "9.3.1"
kotlin = "2.4.10"
vanniktech = "0.37.0"
dokka = "2.2.0"
coreKtx = "1.19.0"
activityCompose = "1.13.0"
composeBom = "2026.06.01"
composeRuntime = "1.9.0"
junit = "4.13.2"
androidxJunit = "1.3.0"
espressoCore = "3.7.0"
annotation = "1.9.1"
window = "1.5.1"
appdimensLegacyGames = "2.0.1"
appdimensDynamic = "3.1.9"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-annotation = { group = "androidx.annotation", name = "annotation", version.ref = "annotation" }
androidx-window = { module = "androidx.window:window", version.ref = "window" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-bom-platform = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-runtime = { group = "androidx.compose.runtime", name = "runtime", version.ref = "composeRuntime" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui", version.ref = "composeRuntime" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
appdimens-games-legacy = { group = "io.github.bodenberg", name = "appdimens-games", version.ref = "appdimensLegacyGames" }
appdimens-dynamic = { group = "io.github.bodenberg", name = "appdimens-dynamic", version.ref = "appdimensDynamic" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
vanniktech-maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktech" }
dokka-jetbrains = { id = "org.jetbrains.dokka", version.ref = "dokka" }
